[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping"
version = "0.1.0"
description = "Turn long videos into short, captioned vertical clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0.0"]

[project.optional-dependencies]
download = ["yt-dlp>=2024.1.1"]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=7.0"]

[project.scripts]
clipping = "clipping.cli:main"

[tool.setuptools]
packages = ["clipping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
